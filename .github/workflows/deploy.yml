name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # O site fica em /NOME-DO-REPOSITORIO/
          VITE_BASE: /${{ github.event.repository.name }}/
          # URL do projeto e chave publishable (anon) do Supabase. Os dois valores são PÚBLICOS por
          # design: já vão dentro do JavaScript entregue a qualquer visitante do site. Quem protege os
          # dados é o Row Level Security do banco. A chave secreta (service_role) NUNCA entra aqui.
          VITE_SUPABASE_URL: https://fffhnglbovodfrpdosng.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_d3JKA56MIN0idhVZF6lVBA_NoDteess

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
